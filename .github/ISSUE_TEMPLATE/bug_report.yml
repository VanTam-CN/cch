name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: CCH version or commit, Python version, and operating system. Omit identifying paths.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal synthetic example. Redact credentials and private project content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant checks or error codes
      description: Include only sanitized output. A passing local test is not production evidence.
